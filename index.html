<!DOCTYPE html>
<html>
<head>
    <title>PixelBuffer 16K Test</title>
    <meta charset="UTF-8">
</head>
<body>
<h1>PixelBuffer 16K Test</h1>
<p>Testing large canvas size: 16384×9216 (16K UHD)</p>
<pre id="log"></pre>
<video id="video" width="320" height="240" autoplay style="display:none;"></video>

<script>
const log = document.getElementById('log');

function jsjsprint(msg) {
    log.textContent += msg + '\n';
    console.log(msg);
}

jsjsprint("16K PIXELBUFFER TEST");
jsjsprint("=".repeat(70));
jsjsprint("");

// 16K UHD resolution
const WIDTH = 16384;
const HEIGHT = 9216;
const ITERATIONS = 50;

async function runTest() {
    const calculated = WIDTH * HEIGHT * 4;
    jsprint(`Canvas: ${WIDTH}×${HEIGHT}`);
    jsprint(`Size: ${(calculated / (1024**3)).toFixed(2)} GB per frame`);
    jsprint(`Iterations: ${ITERATIONS}`);
    jsprint("");
    jsprint("Starting in 2 seconds...");
    jsprint("");

    await new Promise(r => setTimeout(r, 2000));

    // Setup video
    try {
        const video = document.getElementById('video');
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;
        await new Promise(resolve => {
            video.onloadedmetadata = () => {
                video.play();
                resolve();
            };
        });
        jsprint("✓ Video ready");
    } catch (e) {
        jsprint("No video - using static canvas");
    }

    jsprint("");
    jsprint("=".repeat(70));
    jsprint("STARTING TEST");
    jsprint("=".repeat(70));

    try {
        const canvas = document.createElement('canvas');
        canvas.width = WIDTH;
        canvas.height = HEIGHT;
        const ctx = canvas.getContext('2d');

        ctx.fillStyle = '#FF0000';
        ctx.fillRect(0, 0, WIDTH, HEIGHT);

        const video = document.getElementById('video');

        for (let i = 0; i < ITERATIONS; i++) {
            if (video.readyState >= 2) {
                ctx.drawImage(video, 0, 0, WIDTH, HEIGHT);
            } else {
                ctx.fillRect(0, 0, WIDTH, HEIGHT);
            }

            if (i % 10 === 0) {
                const dialogs = Math.floor(i / 10) + 1;
                console.log(`🖨️  Dialog #${dialogs} at iteration ${i}`);
                jsprint(`Dialog ${dialogs} (iteration ${i})`);
                try {
                    ctx.getImageData(0, 0, 100, 100);
                } catch (e) {}
            }

            await new Promise(r => setTimeout(r, 10));
        }

        jsprint("");
        jsprint("✓ Completed " + ITERATIONS + " frames");
        jsprint("No crash");

    } catch (e) {
        jsprint("");
        jsprint("💥 CRASHED!");
        jsprint("Check Frida output");
        jsprint("");
        jsprint("Exception: " + e.message);
        console.error(e);
    }
}

// Auto-start
jsprint("Loading...");
runTest();
</script>
</body>
</html>
